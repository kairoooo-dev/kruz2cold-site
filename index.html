<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kruz2Cold</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #1a1a1a;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            align-items: center;
            padding: 16px 40px;
            border-bottom: 1px solid #e8e8e8;
        }

        .navbar-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #1a1a1a;
        }

        .navbar-pfp {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .navbar-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .navbar-menu {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .navbar-menu svg {
            width: 24px;
            height: 24px;
        }

        .main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 40px 80px;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 50px;
        }

        .product-image {
            background: #f5f5f5;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .product-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: #555;
            font-size: 0.95rem;
        }

        .product-author img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }

        .product-author a {
            color: #555;
            text-decoration: underline;
        }

        .product-price {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #242424;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: #333;
        }

        .sold {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            color: #555;
            font-size: 0.95rem;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: #555;
            font-size: 0.95rem;
        }

        .share-section {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .share-label {
            font-size: 0.9rem;
            color: #555;
        }

        .share-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .share-btn:hover {
            background: #e0e0e0;
        }

        .share-btn svg {
            width: 16px;
            height: 16px;
        }

        .report-btn {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .report-btn svg {
            width: 16px;
            height: 16px;
        }

        .description {
            border-top: 1px solid #e8e8e8;
            padding-top: 30px;
        }

        .description h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .description p {
            color: #444;
            line-height: 1.7;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            border-top: 1px solid #e8e8e8;
            color: #999;
            font-size: 0.85rem;
            margin-top: 60px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: #999;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .navbar {
                padding: 16px 20px;
            }
            .main {
                padding: 30px 20px 60px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="navbar-profile">
            <img src="pfp.png" alt="Kruz2Cold" class="navbar-pfp">
            <span class="navbar-name">Kruz2Cold</span>
        </a>
        <button class="navbar-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </nav>

    <div class="main">
        <div class="product-layout">
            <div class="product-image">
                <img src="pfp.png" alt="PigWhite">
            </div>
            <div class="product-right">
                <h1 class="product-title">PigWhite</h1>
                <div class="product-author">
                    <img src="pfp.png" alt="Kruz2Cold">
                    <span>Kruz2Cold</span>
                    <a href="#">View shop</a>
                </div>
                <div class="product-price">FREE</div>
                <a href="Pigman-White.zip" download class="buy-btn" onclick="trackInstall()">Install Now</a>
                <div class="sold">
                    <span>🔥</span>
                    <span><span id="install-count">0</span> installed</span>
                </div>
                <div class="tag">
                    <span>📦</span>
                    <span>A Minecraft Texturepack</span>
                </div>
                <div class="share-section">
                    <span class="share-label">Share this</span>
                    <button class="share-btn" title="Copy link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </button>
                    <button class="share-btn" title="X / Twitter">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                    </button>
                    <button class="share-btn" title="Facebook">
                        <svg viewBox="0 0 24 24" fill="#1877f2">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </button>
                    <button class="report-btn" title="Report">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                            <line x1="4" y1="22" x2="4" y2="15"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="description">
            <h3>Description</h3>
            <p>Get the White themed Texturepack Created by Pigman.</p>
        </div>
    </div>

    <footer class="footer">
        <span>&copy; Kruz2Cold</span>
        <div class="footer-links">
            <a href="#">Cookie settings</a>
            <a href="#">Terms</a>
            <a href="#">Privacy</a>
        </div>
    </footer>
    <script>
        const COUNTER_KEY = 'kruz2cold-pigwhite-installs';

        function getCounter() {
            return localStorage.getItem(COUNTER_KEY) || '0';
        }

        function setCounter(val) {
            localStorage.setItem(COUNTER_KEY, val);
        }

        document.getElementById('install-count').textContent = getCounter();

        function trackInstall() {
            let count = parseInt(getCounter()) + 1;
            setCounter(count);
            document.getElementById('install-count').textContent = count;
        }
    </script>
</body>
</html>
